[package]
name = "zka-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Canonical ZKA chain / asset / verifier / public-input encoding registry (compiled-in, fail-closed)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Endpoint parsing for the fail-closed transport policy (transport.rs).
url = "2"
