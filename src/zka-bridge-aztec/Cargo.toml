[package]
name = "zka-bridge-aztec"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "ZKA settlement adapter boundary for Aztec: L2 node client (proven-block + outbox witness queries) and L1 portal/outbox consumption tracking"

[lib]
name = "zka_bridge_aztec"
path = "lib.rs"

[dependencies]
# Canonical chain/asset/verifier/public-input encoding registry (fail-closed).
zka-registry = { path = "../zka-registry" }
async-trait = "0.1"
base64 = { version = "0.23", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
