[profile.default]
src = "contracts"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.1.0/",
    "forge-std/=dependencies/forge-std-1.9.7/src/",
]

[dependencies]
forge-std = { version = "1.9.7" }
"@openzeppelin-contracts" = { version = "5.1.0" }

[profile.default.fuzz]
runs = 256
